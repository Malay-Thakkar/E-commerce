version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ps-thakkar-app:latest
    container_name: ${COMPOSE_PROJECT_NAME}_web
    ports:
      - "8000:8000"
    volumes:
      - .:/E-commerce
      - ./staticfiles:/app/staticfiles
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    entrypoint: ["/E-commerce/entrypoint.sh", "web"]
    networks:
      - default

  db:
    image: postgres:15
    container_name: ${COMPOSE_PROJECT_NAME}_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  redis:
    image: redis:6.2
    container_name: ${COMPOSE_PROJECT_NAME}_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - default

  celery:
    image: ps-thakkar-app:latest
    container_name: ${COMPOSE_PROJECT_NAME}_celery
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/E-commerce
    env_file:
      - .env
    command: celery -A E_commerce worker --loglevel=info
    entrypoint: ["/E-commerce/entrypoint.sh", "celery"]
    networks:
      - default

  celery-beat:
    image: ps-thakkar-app:latest
    container_name: ${COMPOSE_PROJECT_NAME}_celery_beat
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/E-commerce
    env_file:
      - .env
    command: celery -A E_commerce beat --loglevel=info
    entrypoint: ["/E-commerce/entrypoint.sh", "celery-beat"]
    networks:
      - default

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.13
    container_name: ${COMPOSE_PROJECT_NAME}_elasticsearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "${ELASTICSEARCH_PORT}:${ELASTICSEARCH_PORT}"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.13
    container_name: ${COMPOSE_PROJECT_NAME}_kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - default
    depends_on:
      elasticsearch:
        condition: service_healthy

  # --- NEW CHATBOT SERVICES ---
  rasa:
    image: rasa/rasa:3.6.10-full
    container_name: ${COMPOSE_PROJECT_NAME}_rasa
    ports:
      - "5005:5005"
    volumes:
      - ./rasa:/app/
    command: run --enable-api --cors "*" --model /app/models
    networks:
      - default
    depends_on:
      - action_server

  action_server:
    build:
      context: ./rasa/actions
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_action_server
    ports:
      - "5055:5055"
    volumes:
      - ./rasa/actions:/app/actions
    networks:
      - default
    depends_on:
      - web

  ollama:
    image: ollama/ollama
    container_name: ${COMPOSE_PROJECT_NAME}_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - default
    dns:
      - 8.8.8.8

volumes:
  postgres_data:
  ollama_data:

networks:
  default:

