version: "3.1"
nlu:
- intent: greet
  examples: |
    - hi
    - hello
    - hey there
    - good morning
    - good afternoon
    - good evening

- intent: goodbye
  examples: |
    - bye
    - goodbye
    - good night
    - see you later

- intent: who_are_you
  examples: |
    - who are you?

- lookup: product_name
  examples: |
    - data/lookups/product_names.txt

- regex: product_with_number
  examples: |
    - Product \d+

- intent: search_product
  examples: |
    - I want to buy a [Kitkat](product_name)
    - Do you have any [Munch](product_name) bars in stock?
    - Search for [Perk](product_name)
    - Can you find [Inderjoy](product_name) for me?
    - I'm trying to find [Product 15](product_name)
    - Where can I find [Product 99](product_name)?
    - Show me the details for [Product 7](product_name)
    - find me the item called [Test](product_name)
    - I am looking for [Test](product_name)
    - search for product [Product 42](product_name)

- intent: add_to_cart
  examples: |
    - add this to cart
    - add one [product_name](product_name)
    - add [product_name](product_name) to cart
    - add [product_name](product_name) to my cart
    - add the [product_name](product_name) to my cart
    - put [2](quantity) [product_name](product_name) in the basket
    - put [Product 13](product_name) in my cart

- intent: remove_from_cart
  examples: |
    - remove the [laptop](product_name) from my cart
    - delete [Product 12](product_name) from cart
    - get rid of the [t-shirt](product_name)

- intent: update_cart_quantity
  examples: |
    -   
    - change [Product 12](product_name) to [5](quantity)
    - I need [2](quantity) of the [t-shirts](product_name)

- intent: view_cart
  examples: |
    - show my cart
    - what's in my shopping cart?
    - view my basket
    - summarize my cart
    
- intent: add_to_wishlist
  examples: |
    - add [smart watch](product_name) to my wishlist
    - save the [leather jacket](product_name) for later

- intent: view_past_orders
  examples: |
    - show me my past orders
    - where can I see my order history?
    - view my orders
    - check my order status
    - check my previous purchases
    - what did I order last time

- intent: ask_complex_question
  examples: |
    - which is better, the [red shirt](product_name) or the [blue one](product_name_secondary)?
    - compare the [Samsung Galaxy](product_name) and the [iPhone 15](product_name_secondary)
    - what is the difference between a [MacBook Pro](product_name) and a [MacBook Air](product_name_secondary)?
    - find me a [laptop](product_name) with good reviews for gaming
    - show me a [camera](product_name) that is good for travel photography
    - I need a [monitor](product_name) with a high refresh rate
    - Can you compare the [Sony headphones](product_name) with the [Bose ones](product_name_secondary)?
    - Tell me which is more powerful, the [Dell XPS](product_name) or the [HP Spectre](product_name_secondary)?
    - I'm looking for a [graphics card](product_name) that can handle 4K video editing
    - What are the main features of the [latest drone](product_name)?